<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" style="max-width:100%;height:auto">

<defs>
  <marker id="arw-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#7b8794"/>
  </marker>
  <marker id="arw-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#3d7ecc"/>
  </marker>
  <marker id="arw-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#2fa08a"/>
  </marker>
  <marker id="arw-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#7b5bd6"/>
  </marker>
  <marker id="arw-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#d98324"/>
  </marker>
  <marker id="arw-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#cf3a3a"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<text x="20" y="26" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans CJK SC',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="700">数据并行中的 AllReduce 梯度同步</text>
<text x="20" y="45" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans CJK SC',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7b8794" text-anchor="start" font-weight="400">各 Rank 用不同数据算出本地梯度 → 归约到一致 → 各 Rank 都拿到同一结果</text>
<rect x="40" y="80" width="190" height="70" rx="9" ry="9" fill="#e8f1fd" stroke="#3d7ecc" stroke-width="1.6"/>
<text x="135.0" y="107" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans CJK SC',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1a5ba8" text-anchor="middle" font-weight="600">Rank 0 本地梯度</text>
<text x="135.0" y="132" font-family="'Cascadia Code',Consolas,'JetBrains Mono','Courier New',monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="700">[1, 3]</text>
<rect x="40" y="176" width="190" height="70" rx="9" ry="9" fill="#e8f1fd" stroke="#3d7ecc" stroke-width="1.6"/>
<text x="135.0" y="203" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans CJK SC',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1a5ba8" text-anchor="middle" font-weight="600">Rank 1 本地梯度</text>
<text x="135.0" y="228" font-family="'Cascadia Code',Consolas,'JetBrains Mono','Courier New',monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="700">[5, 7]</text>
<rect x="288" y="118" width="190" height="72" rx="9" ry="9" fill="#e3f6f1" stroke="#2fa08a" stroke-width="2"/>
<text x="383.0" y="148" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans CJK SC',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#186b5b" text-anchor="middle" font-weight="700">AllReduce</text>
<text x="383.0" y="170" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans CJK SC',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="400">逐元素求和 + 广播到所有 Rank</text>
<path d="M 236 115 L 280 140" fill="none" stroke="#3d7ecc" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arw-blue)"/>
<path d="M 236 211 L 280 168" fill="none" stroke="#3d7ecc" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arw-blue)"/>
<rect x="530" y="80" width="190" height="70" rx="9" ry="9" fill="#e3f6f1" stroke="#2fa08a" stroke-width="1.6"/>
<text x="625.0" y="107" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans CJK SC',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#186b5b" text-anchor="middle" font-weight="600">Rank 0 获得结果</text>
<text x="625.0" y="132" font-family="'Cascadia Code',Consolas,'JetBrains Mono','Courier New',monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="700">[6, 10]</text>
<rect x="530" y="176" width="190" height="70" rx="9" ry="9" fill="#e3f6f1" stroke="#2fa08a" stroke-width="1.6"/>
<text x="625.0" y="203" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans CJK SC',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#186b5b" text-anchor="middle" font-weight="600">Rank 1 获得结果</text>
<text x="625.0" y="228" font-family="'Cascadia Code',Consolas,'JetBrains Mono','Courier New',monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="700">[6, 10]</text>
<path d="M 484 140 L 522 115" fill="none" stroke="#2fa08a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arw-teal)"/>
<path d="M 484 168 L 522 211" fill="none" stroke="#2fa08a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arw-teal)"/>
<line x1="40" y1="272" x2="720" y2="272" stroke="#cbd2d9" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="380" y="292" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans CJK SC',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#7b8794" text-anchor="middle" font-weight="400">算子规定「结果」：所有 Rank 都得到相同归约结果；算法规定「过程」：具体链路与分块由通信算法决定。</text>
<text x="380" y="310" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans CJK SC',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#7b8794" text-anchor="middle" font-weight="400">若需等权平均，对求和结果再除以 Rank 数（本例除以 2 → [3, 5]）。</text>
</svg>
